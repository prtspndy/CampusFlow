<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="CampusFlow runs your student organization in one place: members, events and tickets, merch, fundraisers, and the treasury."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1020" />
    <title>CampusFlow | The Operating System for Student Organizations</title>
    <script>
      // Apply the saved theme before first paint so dark-mode users do not see a white flash.
      (function () {
        try {
          var saved = localStorage.getItem('campusflow_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = saved === 'dark' || (saved !== 'light' && prefersDark) ? 'dark' : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', resolved);
          if (resolved === 'dark') root.classList.add('dark');
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
